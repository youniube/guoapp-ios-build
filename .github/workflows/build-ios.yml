name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      refresh_lockfile:
        description: Regenerate and export the Flutter dependency lockfile
        type: boolean
        default: false
      embed_legacy_session:
        description: Embed the shared Huangguo legacy session from the repository secret
        type: boolean
        default: false
      run_audit:
        description: Run the requested code audit and Python source regressions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: |
          if [[ "${{ inputs.refresh_lockfile }}" == "true" ]]; then
            flutter pub get
          else
            flutter pub get --enforce-lockfile
          fi
      - name: Check changed Dart formatting
        run: |
          source_commit="$(git log -1 --format=%H -- lib test)"
          while IFS= read -r -d '' source; do
            if [[ -f "$source" ]]; then
              dart format "$source"
            fi
          done < <(git diff-tree --root --no-commit-id --name-only -r -z "$source_commit" -- '*.dart')
          git diff --exit-code -- '*.dart'
      - name: Check iOS build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          pod --version
      - name: Verify imported source adapters
        run: |
          python3 -m unittest discover -s ../scripts -p 'test_*.py'
          go vet ./...
          go test ./core -run 'TestPython|TestCatpaw|TestImported|TestAttached|TestMaccms|TestCatalogRestore' -count=1
          go test ./core -ldflags='-X duanjuapp/native/core.buildAllSources=true' -run 'TestPython|TestCatpaw|TestImported|TestAttached|TestMaccms|TestCatalogRestore' -count=1
        working-directory: native
      - name: Verify source visibility and retirement in Flutter
        run: |
          flutter test test/app_build_test.dart test/source_visibility_test.dart --dart-define=DISABLE_REMOTE_IMAGES=true
          flutter test test/app_build_test.dart test/source_visibility_test.dart --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      - name: Verify episode line selection and playback
        env:
          EPISODE_LINE_SCREENSHOT: dist/diagnostics/episode-lines.png
        run: |
          flutter test test/episode_lines_test.dart test/follow_state_test.dart test/playback_loader_test.dart test/player_screen_test.dart --dart-define=DISABLE_REMOTE_IMAGES=true
          flutter test test/episode_lines_test.dart --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      - name: Upload episode line UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-lines-ui-preview
          path: dist/diagnostics/episode-lines.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify player operation feedback
        env:
          PLAYER_FEEDBACK_SCREENSHOTS: dist/diagnostics/player-feedback
          PLAYER_FEEDBACK_FONT: /System/Library/Fonts/STHeiti Medium.ttc
          HOME_UI_SCREENSHOTS: dist/diagnostics/player-feedback
        run: |
          dart analyze --fatal-infos lib/player_feedback.dart lib/player_interactions.dart lib/player_controls.dart lib/television_controls.dart lib/remote_widgets.dart test/player_feedback_test.dart test/television_player_test.dart
          flutter test test/player_feedback_test.dart test/television_player_test.dart --dart-define=DISABLE_REMOTE_IMAGES=true
          flutter test test/catalog_categories_test.dart --plain-name 'compact home keeps search' --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      - name: Upload player feedback UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-feedback-ui-previews
          path: dist/diagnostics/player-feedback/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Python import and permission regressions
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true test/python_sources_test.dart test/source_visibility_test.dart test/sources_test.dart test/profiles_test.dart test/television_player_test.dart
      - name: Audit all Flutter tests
        if: inputs.run_audit
        continue-on-error: true
        run: |
          mkdir -p dist/diagnostics/code-audit
          set +e
          flutter test --dart-define=DISABLE_REMOTE_IMAGES=true > dist/diagnostics/code-audit/flutter-default.log 2>&1
          default_result=$?
          flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true > dist/diagnostics/code-audit/flutter-all-sources.log 2>&1
          all_sources_result=$?
          printf '{"default":%s,"allSources":%s}\n' "$default_result" "$all_sources_result" > dist/diagnostics/code-audit/flutter-results.json
          tail -n 10 dist/diagnostics/code-audit/flutter-default.log
          tail -n 10 dist/diagnostics/code-audit/flutter-all-sources.log
          if [[ "$default_result" != 0 || "$all_sources_result" != 0 ]]; then exit 1; fi
      - name: Upload Flutter audit results
        if: always() && inputs.run_audit
        uses: actions/upload-artifact@v4
        with:
          name: flutter-code-audit
          path: dist/diagnostics/code-audit/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload dependency lockfile
        if: inputs.refresh_lockfile
        uses: actions/upload-artifact@v4
        with:
          name: flutter-lockfile
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1
      - name: Build all-source unsigned IPA
        env:
          EMBED_LEGACY_SESSION: ${{ inputs.embed_legacy_session }}
          HUANGGUO_LEGACY_SESSION: ${{ inputs.embed_legacy_session && secrets.HUANGGUO_LEGACY_SESSION || '' }}
          GUOAPP_SOURCE_ACCESS: ${{ secrets.GUOAPP_SOURCE_ACCESS }}
        run: |
          args=(--all-sources --require-source-access)
          if [[ "$EMBED_LEGACY_SESSION" == "true" ]]; then args+=(--require-legacy-session); fi
          python3 scripts/build_ios.py "${args[@]}"
      - name: Upload IPA and checksums
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-ios-unsigned
          path: |
            dist/ios/*-ios-unsigned.ipa
            dist/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
